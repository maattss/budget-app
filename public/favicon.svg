<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
    <!--
        The Saldo mark, matching resources/views/components/app-logo-icon.blade.php.

        Inverts with the browser's theme the same way the app's accent does, so the
        tile never becomes a dark square on a dark tab strip. The raster fallbacks in
        favicon.ico cannot do this - a .ico holds one fixed set of pixels - so they
        stay dark-on-light, which is the safer of the two when you only get one.
    -->
    <style>
        .tile { fill: #262626; }
        .mark { fill: #ffffff; }

        @media (prefers-color-scheme: dark) {
            .tile { fill: #ffffff; }
            .mark { fill: #262626; }
        }
    </style>

    <rect class="tile" width="24" height="24" rx="5.25" />

    <g class="mark" transform="translate(0 -0.375)">
        <rect x="3" y="18.75" width="18" height="1.5" rx="0.75" />
        <path d="M5.5 16.875V12a1.5 1.5 0 0 1 3 0v4.875h-3ZM10.5 16.875V8.25a1.5 1.5 0 0 1 3 0v8.625h-3ZM15.5 16.875V4.5a1.5 1.5 0 0 1 3 0v12.375h-3Z" />
    </g>
</svg>

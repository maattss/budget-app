name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      # setup:ci deliberately omits `artisan migrate`. The suite runs on in-memory
      # SQLite (phpunit.xml) and RefreshDatabase migrates it per test, so CI needs no
      # database server at all. `composer setup` keeps the migrate step for local use.
      - name: Setup Application
        run: composer setup:ci

      - name: Run CI Checks
        run: composer ci:check
